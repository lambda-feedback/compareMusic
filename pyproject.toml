[tool.poetry]
name = "evaluation_function"
version = "0.0.1"
description = ""
authors = ["Andreas Pfurtscheller <andreas.pfurtscheller23@ic.ac.uk>"]
readme = "README.md"
packages = [{ include = "evaluation_function" }]

[tool.poetry.scripts]
evaluation_function = "evaluation_function.main:main"
evaluation_function_dev = "evaluation_function.dev:dev"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
typing_extensions = "^4.12.2"
lf_toolkit = { git = "https://github.com/lambda-feedback/toolkit-python.git", branch = "main", extras = [
    "ipc",
] }
numpy = "<2.0"
matplotlib = "^3.11.0"
pretty-midi = "^0.2.11"
pandas = "^3.0.3"
librosa = "^0.11.0"
# The "onnx" extra pins an inference backend explicitly. Without it,
# basic-pitch relies on platform markers that leave linux/arm64 with no
# backend at all, so the container dies at import. See backend_test.py.
basic-pitch = { version = "^0.4.0", extras = ["onnx"] }
setuptools = "<81"
tqdm = "^4.68.4"
huggingface-hub = "^1.23.0"
partitura = "^1.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
flake8 = "^7.1.0"
ipykernel = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
